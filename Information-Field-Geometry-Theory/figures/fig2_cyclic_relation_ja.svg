<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Times New Roman', 'Liberation Serif', 'Noto Serif CJK JP', serif">
  <defs>
    <style>
      .title { font-size: 18px; fill: #111; font-weight: 500; }
      .node-diff { fill: #ffffff; stroke: #1f77b4; stroke-width: 2; }
      .node-quasi { fill: #fff5ea; stroke: #ff7f0e; stroke-width: 3.5; }
      .node-struct { fill: #ffffff; stroke: #2ca02c; stroke-width: 2; }
      .node-text { font-size: 16px; fill: #111; text-anchor: middle; }
      .node-text-main { font-size: 19px; fill: #111; text-anchor: middle; font-weight: 500; }
      .node-sub { font-size: 12px; fill: #666; text-anchor: middle; font-style: italic; }
      .arrow-curve { fill: none; stroke: #444; stroke-width: 2; }
      .arrow-label { font-size: 13px; fill: #444; text-anchor: middle; font-style: italic; }
      .note { font-size: 13px; fill: #333; text-anchor: middle; font-style: italic; }
    </style>
    <marker id="arrow3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>
  
  <rect width="900" height="580" fill="#fafafa"/>
  <text x="450.0" y="40" text-anchor="middle" class="title">図3. VEDとIFGTの循環的関係</text>
  <path d="M 323.8 348.6 Q 328.5 250.3 402.5 180.2" class="arrow-curve" marker-end="url(#arrow3)"/>
  <path d="M 497.5 180.2 Q 567.2 242.3 569.7 337.4" class="arrow-curve" marker-end="url(#arrow3)"/>
  <path d="M 542.2 385.0 Q 440.6 422.3 344.8 385.0" class="arrow-curve" marker-end="url(#arrow3)"/>
  <text x="297.1" y="237.4" class="arrow-label">部分閉包</text>
  <text x="597.7" y="227.2" class="arrow-label">拘束</text>
  <text x="438.1" y="456.2" class="arrow-label">再生成</text>
  <circle cx="302.8" cy="385.0" r="42" class="node-diff"/>
  <text x="302.8" y="390.0" class="node-text">差分</text>
  <ellipse cx="450.0" cy="130.0" rx="95" ry="58" class="node-quasi"/>
  <text x="450.0" y="126.0" class="node-text-main">準閉包</text>
  <text x="450.0" y="148.0" class="node-sub">（IFGT）</text>
  <circle cx="597.2" cy="385.0" r="55" class="node-struct"/>
  <text x="597.2" y="383.0" class="node-text">構造</text>
  <text x="597.2" y="401.0" class="node-sub">（VED）</text>
  <text x="450.0" y="550" class="note">情報と物質は相互干渉を通じて循環的に生成される。</text>
</svg>
