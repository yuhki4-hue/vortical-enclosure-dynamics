<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">

  <rect width="1400" height="820" fill="#FAFAF8"/>

  <!-- TITLE -->
  <text x="700" y="50" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">
    Fig.1  The C-Landscape and the Inference Trajectory
  </text>
  <text x="700" y="76" font-size="14" fill="#555555" text-anchor="middle" font-style="italic">
    Inference flows along ∇C but never reaches an internal fixed point (Theorem 3.1)
  </text>

  <defs>
    <marker id="aBlue1" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2980B9"/>
    </marker>
    <marker id="aRed1" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#C0392B"/>
    </marker>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feOffset dx="0" dy="1.5" in="b" result="o"/>
      <feComponentTransfer in="o" result="oo"><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode in="oo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0392B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- ===== MAIN PANEL: landscape cross-section ===== -->
  <!-- panel frame -->
  <rect x="110" y="120" width="900" height="540" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1" rx="8" filter="url(#sh1)"/>

  <!-- axes -->
  <line x1="160" y1="600" x2="960" y2="600" stroke="#666666" stroke-width="1.5"/>
  <line x1="160" y1="600" x2="160" y2="160" stroke="#666666" stroke-width="1.5"/>
  <text x="960" y="628" font-size="13" fill="#444444" text-anchor="end">state space  𝒳</text>
  <text x="150" y="155" font-size="13" fill="#444444" text-anchor="end" transform="rotate(0)">C</text>
  <text x="135" y="180" font-size="12" fill="#888888" text-anchor="end">C<tspan font-size="0.72em" baseline-shift="-22%">max</tspan></text>
  <line x1="160" y1="185" x2="960" y2="185" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="700" y="178" font-size="12" fill="#C0392B" text-anchor="middle" font-style="italic">C → C<tspan font-size="0.72em" baseline-shift="-22%">max</tspan> : unreachable boundary (divergence)</text>

  <!-- C-landscape curve: valleys (high ∇C) and local maxima (shallow), rising toward C_max but never touching -->
  <path d="M 160 540
           Q 230 430, 300 470
           Q 360 505, 420 360
           Q 470 250, 540 300
           Q 600 345, 660 280
           Q 720 225, 790 330
           Q 850 415, 910 250
           Q 945 200, 960 215"
        stroke="#2C3E50" stroke-width="2.5" fill="none"/>
  <!-- shaded region under curve -->
  <path d="M 160 540
           Q 230 430, 300 470
           Q 360 505, 420 360
           Q 470 250, 540 300
           Q 600 345, 660 280
           Q 720 225, 790 330
           Q 850 415, 910 250
           Q 945 200, 960 215
           L 960 600 L 160 600 Z"
        fill="#ECF0F1" opacity="0.6"/>

  <!-- near-boundary cliff shading -->
  <rect x="860" y="160" width="100" height="440" fill="url(#cliff)"/>

  <!-- local maxima markers (shallow attractors, not fixed points) -->
  <circle cx="420" cy="360" r="5" fill="#27AE60"/>
  <text x="420" y="348" font-size="10.5" fill="#1E8449" text-anchor="middle">local max</text>
  <circle cx="660" cy="280" r="5" fill="#27AE60"/>
  <text x="660" y="268" font-size="10.5" fill="#1E8449" text-anchor="middle">local max</text>

  <!-- valley label -->
  <text x="300" y="492" font-size="10.5" fill="#2980B9" text-anchor="middle">valley (high ∇C)</text>
  <text x="540" y="322" font-size="10.5" fill="#888888" text-anchor="middle">saddle</text>

  <!-- INFERENCE TRAJECTORY: blue, moving along the surface, never settling -->
  <!-- a series of points + arrows climbing along the landscape -->
  <g>
    <path d="M 200 525
             Q 260 470, 310 472
             Q 380 475, 415 375
             Q 455 295, 535 305
             Q 600 312, 655 290
             Q 720 262, 785 335
             Q 845 400, 900 280"
          stroke="#2980B9" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#aBlue1)"/>
    <!-- trajectory points x_n -->
    <circle cx="200" cy="525" r="4.5" fill="#2980B9"/>
    <text x="200" y="548" font-size="10" fill="#2980B9" text-anchor="middle">x₀</text>
    <circle cx="415" cy="375" r="4.5" fill="#2980B9"/>
    <text x="415" y="398" font-size="10" fill="#2980B9" text-anchor="middle">xₙ</text>
    <circle cx="655" cy="290" r="4.5" fill="#2980B9"/>
    <text x="655" y="312" font-size="10" fill="#2980B9" text-anchor="middle">xₙ₊ₖ</text>
  </g>

  <!-- annotation: never stops at local max -->
  <g transform="translate(455,420)">
    <path d="M 0 0 Q -20 -35, -35 -55" stroke="#7D3C98" stroke-width="1.4" fill="none" stroke-dasharray="3,2"/>
    <text x="6" y="6" font-size="11" fill="#5B2C72" font-style="italic">passes through,</text>
    <text x="6" y="22" font-size="11" fill="#5B2C72" font-style="italic">does not settle</text>
  </g>

  <!-- divergence at boundary -->
  <text x="905" y="262" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="600">↑ diverges</text>

  <!-- ===== RIGHT PANEL: why no fixed point ===== -->
  <g transform="translate(1040,140)">
    <rect x="0" y="0" width="300" height="200" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" rx="8" filter="url(#sh1)"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#2980B9">No internal fixed point</text>
    <line x1="20" y1="46" x2="280" y2="46" stroke="#E5E5E5"/>
    <text x="20" y="74" font-size="12.5" fill="#444444">If F(x*) = x* existed, then by</text>
    <text x="20" y="94" font-size="12.5" fill="#444444">justification monotonicity (P2):</text>
    <text x="150" y="124" font-size="14" fill="#1A1A1A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">J(F(x*)) &gt; J(x*)</text>
    <text x="150" y="150" font-size="14" fill="#C0392B" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">⇒ J(x*) &gt; J(x*)</text>
    <text x="150" y="176" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">contradiction ∎</text>
  </g>

  <g transform="translate(1040,370)">
    <rect x="0" y="0" width="300" height="170" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5" rx="8" filter="url(#sh1)"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#C0392B">C<tspan font-size="0.72em" baseline-shift="-22%">max</tspan> boundary</text>
    <line x1="20" y1="46" x2="280" y2="46" stroke="#E5E5E5"/>
    <text x="20" y="72" font-size="12.5" fill="#444444">VED basic equation term:</text>
    <text x="150" y="104" font-size="15" fill="#1A1A1A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">− κ<tspan font-size="0.72em" baseline-shift="-22%">B</tspan> / (C<tspan font-size="0.72em" baseline-shift="-22%">max</tspan> − C)</text>
    <text x="20" y="134" font-size="12.5" fill="#444444">diverges as C → C<tspan font-size="0.72em" baseline-shift="-22%">max</tspan>.</text>
    <text x="20" y="154" font-size="12" fill="#888888" font-style="italic">Complete closure is unreachable.</text>
  </g>

  <g transform="translate(1040,570)">
    <rect x="0" y="0" width="300" height="90" fill="#F1E8F5" stroke="#7D3C98" stroke-width="1.2" rx="8"/>
    <text x="20" y="32" font-size="13.5" font-weight="700" fill="#5B2C72">Inference = motion</text>
    <text x="20" y="56" font-size="12" fill="#5B2C72">The trajectory is designed to move,</text>
    <text x="20" y="74" font-size="12" fill="#5B2C72">not to stop. Stopping comes later (L<tspan font-size="0.72em" baseline-shift="-22%">E</tspan>).</text>
  </g>

  <!-- ===== BOTTOM strip ===== -->
  <g transform="translate(0,690)">
    <rect x="110" y="0" width="1230" height="56" fill="#FDF6E3" rx="6" stroke="#B7950B" stroke-width="0.8" opacity="0.9"/>
    <text x="725" y="24" font-size="13" font-weight="600" fill="#7D6608" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">
      x<tspan font-size="0.72em" baseline-shift="-22%">n+1</tspan> = F(x<tspan font-size="0.72em" baseline-shift="-22%">n</tspan>),   J(F(x)) &gt; J(x)   ⇒   ∀x: F(x) ≠ x   (within fixed θ, movement-type A)
    </text>
    <text x="725" y="44" font-size="11.5" fill="#7D6608" text-anchor="middle" font-style="italic">
      The inference layer L<tspan font-size="0.72em" baseline-shift="-22%">F</tspan> cannot close by itself. This is not a defect — it is the structure of motion (§3).
    </text>
  </g>

  <!-- FOOTER -->
  <text x="110" y="780" font-size="10.5" fill="#888888">
    Color key:  inference trajectory (blue)  ·  local maxima / shallow attractors (green)  ·  divergence &amp; non-closure (red)  ·  remark (purple)
  </text>

</svg>
