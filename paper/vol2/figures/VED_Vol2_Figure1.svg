<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Georgia, 'Times New Roman', serif">

  <!-- Background: white -->
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════
       LAYER 1 — Two-node relation (left)
       ═══════════════════════════════════════════════════ -->

  <circle cx="82" cy="178" r="4.5" fill="#555"/>
  <circle cx="198" cy="178" r="4.5" fill="#555"/>

  <line x1="88" y1="178" x2="192" y2="178" stroke="#999" stroke-width="1.1"/>
  <polygon points="190,175 198,178 190,181" fill="#999"/>
  <polygon points="90,175 82,178 90,181" fill="#999"/>

  <text x="140" y="148" text-anchor="middle" font-size="11.5" fill="#333" font-style="italic">Two-node relation</text>
  <text x="140" y="215" text-anchor="middle" font-size="10.5" fill="#999">No closure</text>
  <text x="140" y="231" text-anchor="middle" font-size="10.5" fill="#999">No area</text>
  <text x="140" y="247" text-anchor="middle" font-size="10.5" fill="#999">No persistence</text>

  <!-- ═══════════════════════════════════════════════════
       ARROW: Layer 1 to Layer 2
       ═══════════════════════════════════════════════════ -->
  <line x1="236" y1="183" x2="278" y2="183" stroke="#bbb" stroke-width="1.1"/>
  <polygon points="276,180 284,183 276,186" fill="#bbb"/>

  <!-- ═══════════════════════════════════════════════════
       LAYER 2 — Minimal triangular closure (center)
       ═══════════════════════════════════════════════════ -->

  <polygon points="460,90 355,278 565,278" fill="#dde8f5" stroke="none"/>
  <line x1="460" y1="90" x2="355" y2="278" stroke="#3a6ea5" stroke-width="1.6"/>
  <line x1="460" y1="90" x2="565" y2="278" stroke="#3a6ea5" stroke-width="1.6"/>
  <line x1="355" y1="278" x2="565" y2="278" stroke="#3a6ea5" stroke-width="1.6"/>
  <circle cx="460" cy="90"  r="4.5" fill="#2c5282"/>
  <circle cx="355" cy="278" r="4.5" fill="#2c5282"/>
  <circle cx="565" cy="278" r="4.5" fill="#2c5282"/>

  <!-- Internal vectors from centroid (460,215) -->
  <line x1="460" y1="215" x2="460" y2="118" stroke="#3a6ea5" stroke-width="1.1" stroke-dasharray="4,3"/>
  <polygon points="457,122 460,112 463,122" fill="#3a6ea5"/>
  <line x1="460" y1="215" x2="381" y2="264" stroke="#3a6ea5" stroke-width="1.1" stroke-dasharray="4,3"/>
  <polygon points="377,258 375,268 384,262" fill="#3a6ea5"/>
  <line x1="460" y1="215" x2="539" y2="264" stroke="#3a6ea5" stroke-width="1.1" stroke-dasharray="4,3"/>
  <polygon points="536,258 545,262 543,268" fill="#3a6ea5"/>

  <text x="469" y="150" font-size="11" fill="#2c5282" font-style="italic">e&#x2081;</text>
  <text x="382" y="256" font-size="11" fill="#2c5282" font-style="italic">e&#x2082;</text>
  <text x="534" y="257" font-size="11" fill="#2c5282" font-style="italic">e&#x2083;</text>

  <text x="464" y="197" text-anchor="middle" font-size="9.5" fill="#4a6fa5" letter-spacing="0.5">closure condition</text>
  <text x="462" y="214" text-anchor="middle" font-size="11.5" fill="#2c5282" font-style="italic">e&#x2081; + e&#x2082; + e&#x2083; &#x2248; 0</text>

  <text x="460" y="308" text-anchor="middle" font-size="12"   fill="#333" font-style="italic">Minimal triangular closure</text>
  <text x="460" y="328" text-anchor="middle" font-size="10.5" fill="#555">First emergence of area</text>
  <text x="460" y="344" text-anchor="middle" font-size="10.5" fill="#555">Self-referential structure</text>

  <!-- ═══════════════════════════════════════════════════
       ARROW: Layer 2 to Layer 3
       ═══════════════════════════════════════════════════ -->
  <line x1="603" y1="183" x2="642" y2="183" stroke="#bbb" stroke-width="1.1"/>
  <polygon points="640,180 648,183 640,186" fill="#bbb"/>

  <!-- ═══════════════════════════════════════════════════
       LAYER 3 — Three structural regimes (right)
       ═══════════════════════════════════════════════════ -->

  <!-- Vertical connector -->
  <line x1="656" y1="90" x2="656" y2="310" stroke="#ccc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="656" y1="90"  x2="668" y2="90"  stroke="#ccc" stroke-width="0.8"/>
  <line x1="656" y1="200" x2="668" y2="200" stroke="#ccc" stroke-width="0.8"/>
  <line x1="656" y1="310" x2="668" y2="310" stroke="#ccc" stroke-width="0.8"/>

  <!-- Non-degenerate -->
  <polygon points="715,55 680,120 750,120" fill="#dde8f5" stroke="none"/>
  <line x1="715" y1="55" x2="680" y2="120" stroke="#3a6ea5" stroke-width="1.5"/>
  <line x1="715" y1="55" x2="750" y2="120" stroke="#3a6ea5" stroke-width="1.5"/>
  <line x1="680" y1="120" x2="750" y2="120" stroke="#3a6ea5" stroke-width="1.5"/>
  <circle cx="715" cy="55"  r="3.5" fill="#2c5282"/>
  <circle cx="680" cy="120" r="3.5" fill="#2c5282"/>
  <circle cx="750" cy="120" r="3.5" fill="#2c5282"/>

  <text x="768" y="75"  font-size="11"   fill="#2c5282" font-weight="bold">Non-degenerate</text>
  <text x="768" y="91"  font-size="10.5" fill="#666">3 d.o.f.</text>
  <text x="768" y="107" font-size="10.5" fill="#666">associated with SU(3)</text>

  <!-- Degenerate -->
  <polygon points="715,206 678,210 752,210" fill="#f5e8d0" stroke="none"/>
  <line x1="715" y1="206" x2="678" y2="210" stroke="#a06020" stroke-width="1.5"/>
  <line x1="715" y1="206" x2="752" y2="210" stroke="#a06020" stroke-width="1.5"/>
  <line x1="678" y1="210" x2="752" y2="210" stroke="#a06020" stroke-width="1.5"/>
  <circle cx="715" cy="206" r="3.5" fill="#a06020"/>
  <circle cx="678" cy="210" r="3.5" fill="#a06020"/>
  <circle cx="752" cy="210" r="3.5" fill="#a06020"/>

  <text x="768" y="191" font-size="11"   fill="#a06020" font-weight="bold">Degenerate</text>
  <text x="768" y="207" font-size="10.5" fill="#666">2 d.o.f.</text>
  <text x="768" y="223" font-size="10.5" fill="#666">associated with SU(2)</text>

  <!-- Extreme -->
  <line x1="690" y1="310" x2="740" y2="310" stroke="#aaa" stroke-width="1.3"/>
  <circle cx="715" cy="310" r="4.5" fill="#888"/>

  <text x="768" y="301" font-size="11"   fill="#888" font-weight="bold">Extreme</text>
  <text x="768" y="317" font-size="10.5" fill="#666">1 d.o.f.</text>
  <text x="768" y="333" font-size="10.5" fill="#666">minimal structure</text>

  <!-- ═══════════════════════════════════════════════════
       FIGURE LABEL
       ═══════════════════════════════════════════════════ -->
  <line x1="40" y1="378" x2="860" y2="378" stroke="#e0e0e0" stroke-width="0.7"/>
</svg>
