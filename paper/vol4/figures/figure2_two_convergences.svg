<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Georgia, serif">

  <rect width="900" height="640" fill="#0d0d0d"/>

  <defs>
    <linearGradient id="horizonGrad2" x1="428" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="30%" stop-color="#3d1a5e"/>
      <stop offset="60%" stop-color="#7b2fa0"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#001a0a"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="blurWeak" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="blurEllipse" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="blurMid" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.0"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8a045"/>
    </marker>
    <marker id="arrowRed2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-size="15" fill="#ddd" font-weight="bold">Two Modes of Convergence Toward the Differential Horizon</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#888" font-style="italic">差の地平線への二つの接近経路</text>

  <!-- ========== 左領域：Spatial Convergence（量子） ========== -->
  <rect x="0" y="58" width="450" height="430" fill="url(#leftGrad)"/>
  <rect x="450" y="58" width="450" height="430" fill="url(#rightGrad)"/>

  <!-- 左上ラベル -->
  <text x="30" y="82" font-size="13" fill="#6ab0f5" font-weight="bold">Spatial Convergence</text>
  <text x="30" y="97" font-size="11" fill="#4a90d9" font-style="italic">Scale ↓</text>
  <text x="30" y="114" font-size="10" fill="#3a7bc8">Quantum / QFT　／　Planck limit</text>

  <!-- 格子：大（左端） -->
  <g stroke="#3a7bc8" stroke-width="1.0" opacity="0.5">
    <line x1="30" y1="140" x2="30" y2="340"/><line x1="70" y1="140" x2="70" y2="340"/>
    <line x1="110" y1="140" x2="110" y2="340"/><line x1="150" y1="140" x2="150" y2="340"/>
    <line x1="30" y1="160" x2="150" y2="160"/><line x1="30" y1="200" x2="150" y2="200"/>
    <line x1="30" y1="240" x2="150" y2="240"/><line x1="30" y1="280" x2="150" y2="280"/>
    <line x1="30" y1="320" x2="150" y2="320"/>
  </g>
  <text x="88" y="358" text-anchor="middle" font-size="9" fill="#3a7bc8" opacity="0.4">large scale structure</text>

  <!-- 格子：中（左中） -->
  <g filter="url(#blurWeak)" stroke="#4a90d9" stroke-width="0.8" opacity="0.5">
    <line x1="200" y1="140" x2="200" y2="340"/><line x1="220" y1="140" x2="220" y2="340"/>
    <line x1="240" y1="140" x2="240" y2="340"/><line x1="260" y1="140" x2="260" y2="340"/>
    <line x1="280" y1="140" x2="280" y2="340"/>
    <line x1="200" y1="150" x2="280" y2="150"/><line x1="200" y1="170" x2="280" y2="170"/>
    <line x1="200" y1="190" x2="280" y2="190"/><line x1="200" y1="210" x2="280" y2="210"/>
    <line x1="200" y1="230" x2="280" y2="230"/><line x1="200" y1="250" x2="280" y2="250"/>
    <line x1="200" y1="270" x2="280" y2="270"/><line x1="200" y1="290" x2="280" y2="290"/>
    <line x1="200" y1="310" x2="280" y2="310"/><line x1="200" y1="330" x2="280" y2="330"/>
  </g>

  <!-- 点描：細かい（地平線近く） -->
  <g filter="url(#blurSoft)" opacity="0.75">
    <circle cx="313" cy="148" r="1.4" fill="#6ab0f5"/><circle cx="321" cy="162" r="1.0" fill="#4a90d9"/>
    <circle cx="329" cy="155" r="1.6" fill="#6ab0f5"/><circle cx="317" cy="175" r="1.2" fill="#4a90d9"/>
    <circle cx="336" cy="168" r="1.0" fill="#6ab0f5"/><circle cx="324" cy="190" r="1.4" fill="#4a90d9"/>
    <circle cx="341" cy="145" r="1.8" fill="#6ab0f5"/><circle cx="330" cy="198" r="1.1" fill="#4a90d9"/>
    <circle cx="319" cy="208" r="1.5" fill="#6ab0f5"/><circle cx="335" cy="215" r="1.3" fill="#4a90d9"/>
    <circle cx="313" cy="225" r="1.6" fill="#6ab0f5"/><circle cx="325" cy="235" r="1.0" fill="#4a90d9"/>
    <circle cx="338" cy="228" r="1.4" fill="#6ab0f5"/><circle cx="320" cy="248" r="1.7" fill="#4a90d9"/>
    <circle cx="332" cy="258" r="1.2" fill="#6ab0f5"/><circle cx="317" cy="268" r="1.5" fill="#4a90d9"/>
    <circle cx="339" cy="262" r="1.0" fill="#6ab0f5"/><circle cx="326" cy="278" r="1.8" fill="#4a90d9"/>
    <circle cx="314" cy="288" r="1.3" fill="#6ab0f5"/><circle cx="335" cy="295" r="1.1" fill="#4a90d9"/>
    <circle cx="323" cy="305" r="1.6" fill="#6ab0f5"/><circle cx="330" cy="320" r="1.4" fill="#4a90d9"/>
    <circle cx="315" cy="330" r="1.2" fill="#6ab0f5"/><circle cx="338" cy="332" r="1.0" fill="#4a90d9"/>
  </g>

  <!-- ぼやけ点群（地平線直前） -->
  <g filter="url(#blurSoft)" opacity="0.4">
    <circle cx="360" cy="160" r="3" fill="#6ab0f5"/>
    <circle cx="370" cy="195" r="4" fill="#4a90d9"/>
    <circle cx="355" cy="230" r="3.5" fill="#6ab0f5"/>
    <circle cx="375" cy="265" r="4" fill="#4a90d9"/>
    <circle cx="363" cy="300" r="3" fill="#6ab0f5"/>
    <circle cx="373" cy="330" r="4.5" fill="#4a90d9"/>
  </g>
  <g filter="url(#blurMid)" opacity="0.2">
    <circle cx="390" cy="200" r="8" fill="#6ab0f5"/>
    <circle cx="395" cy="270" r="9" fill="#4a90d9"/>
    <circle cx="387" cy="330" r="7" fill="#6ab0f5"/>
  </g>

  <!-- 増加する揺らぎラベル -->
  <text x="270" y="375" text-anchor="middle" font-size="9" fill="#4a90d9" font-style="italic">increasing fluctuation</text>
  <text x="270" y="388" text-anchor="middle" font-size="9" fill="#4a90d9" font-style="italic">loss of spatial definability</text>

  <!-- 左→中央への収束矢印 -->
  <path d="M155,240 Q300,240 430,268" stroke="#4a90d9" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" opacity="0.85"/>
  <path d="M155,200 Q300,200 430,248" stroke="#4a90d9" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)" opacity="0.55" stroke-dasharray="5,3"/>

  <!-- ========== 中央：Differential Horizon ========== -->
  <path d="M428,58 Q438,130 434,200 Q431,270 436,340 Q434,400 431,488 L470,488 Q468,400 470,340 Q473,270 470,200 Q467,130 472,58 Z"
        fill="url(#horizonGrad2)" opacity="0.95"/>
  <!-- 揺らぎ線 -->
  <path d="M434,58 Q438,130 434,200 Q431,270 436,340 Q434,400 431,488"
        stroke="#9b4fd4" stroke-width="1.5" fill="none" opacity="0.8" stroke-dasharray="4,3"/>
  <path d="M470,58 Q467,130 470,200 Q473,270 470,340 Q471,400 469,488"
        stroke="#c084fc" stroke-width="1.0" fill="none" opacity="0.6" stroke-dasharray="3,4"/>

  <!-- 地平線ラベル -->
  <text x="450" y="78" text-anchor="middle" font-size="10" fill="#c084fc" font-weight="bold">Differential</text>
  <text x="450" y="91" text-anchor="middle" font-size="10" fill="#c084fc" font-weight="bold">Horizon</text>
  <text x="450" y="105" text-anchor="middle" font-size="9" fill="#9b4fd4" font-style="italic">Transition Band</text>

  <!-- 中央下：divergence -->
  <text x="450" y="400" text-anchor="middle" font-size="9" fill="#ff6b6b">boundary</text>
  <text x="450" y="413" text-anchor="middle" font-size="9" fill="#ff6b6b">contact</text>
  <text x="450" y="430" text-anchor="middle" font-size="10" fill="#ff6b6b" font-weight="bold">divergence</text>

  <!-- ========== 右領域：Temporal Convergence（相対論） ========== -->

  <!-- 右上ラベル -->
  <text x="870" y="82" text-anchor="end" font-size="13" fill="#f0a060" font-weight="bold">Temporal Convergence</text>
  <text x="870" y="97" text-anchor="end" font-size="11" fill="#e8a045" font-style="italic">Velocity ↑</text>
  <text x="870" y="114" text-anchor="end" font-size="10" fill="#c8803a">Relativity　／　c-limit　／　Black hole</text>

  <!-- worldline（右端：通常） -->
  <g stroke="#c8803a" stroke-width="1.2" opacity="0.55">
    <line x1="820" y1="140" x2="820" y2="340"/>
    <line x1="845" y1="140" x2="845" y2="340"/>
    <line x1="860" y1="140" x2="860" y2="340"/>
    <line x1="875" y1="140" x2="875" y2="340"/>
    <!-- 時間目盛 -->
    <line x1="815" y1="160" x2="880" y2="160"/>
    <line x1="815" y1="200" x2="880" y2="200"/>
    <line x1="815" y1="240" x2="880" y2="240"/>
    <line x1="815" y1="280" x2="880" y2="280"/>
    <line x1="815" y1="320" x2="880" y2="320"/>
  </g>
  <text x="847" y="358" text-anchor="middle" font-size="9" fill="#c8803a" opacity="0.7">normal spacetime</text>

  <!-- worldline（中：速度増大で傾く） -->
  <g stroke="#e8a045" stroke-width="1.0" opacity="0.6">
    <line x1="680" y1="140" x2="695" y2="340"/>
    <line x1="710" y1="140" x2="720" y2="340"/>
    <line x1="740" y1="140" x2="745" y2="340"/>
    <line x1="770" y1="140" x2="772" y2="340"/>
    <!-- 圧縮された時間目盛 -->
    <line x1="678" y1="155" x2="775" y2="158"/>
    <line x1="679" y1="185" x2="774" y2="190"/>
    <line x1="680" y1="220" x2="773" y2="228"/>
    <line x1="681" y1="260" x2="773" y2="270"/>
    <line x1="682" y1="305" x2="773" y2="315"/>
  </g>

  <!-- worldline（地平線近く：ほぼ格子・わずかな歪み＋軽いblur） -->
  <g filter="url(#blurSoft)" stroke="#f0a060" stroke-width="1.0" opacity="0.6">
    <line x1="543" y1="148" x2="594" y2="340"/>
    <line x1="560" y1="148" x2="613" y2="340"/>
    <line x1="577" y1="148" x2="624" y2="340"/>
    <line x1="593" y1="148" x2="642" y2="340"/>
    <line x1="609" y1="148" x2="652" y2="340"/>
    <!-- 時間目盛：わずかに波打つ -->
    <path d="M543,165 Q583,168 625,166 Q643,165 655,167"/>
    <path d="M543,210 Q583,214 625,212 Q643,210 655,213"/>
    <path d="M543,262 Q583,267 625,265 Q643,262 655,266"/>
    <path d="M543,318 Q583,323 625,321 Q643,318 655,322"/>
  </g>

  <!-- ぼやけ楕円（地平線帯と歪み格子のあいだ・増量） -->
  <g filter="url(#blurEllipse)" opacity="0.42">
    <ellipse cx="517" cy="152" rx="11" ry="4.5" fill="#f0a060"/>
    <ellipse cx="506" cy="172" rx="4.0" ry="13" fill="#e8a045" transform="rotate(18, 456, 172)"/>
    <ellipse cx="495" cy="192" rx="10" ry="4.5" fill="#f0a060"/>
    <ellipse cx="508" cy="212" rx="13" ry="4.0" fill="#e8a045"/>
    <ellipse cx="499" cy="232" rx="4.5" ry="11" fill="#f0a060" transform="rotate(-12, 449, 232)"/>
    <ellipse cx="506" cy="252" rx="12" ry="4.0" fill="#e8a045"/>
    <ellipse cx="499" cy="272" rx="10" ry="4.5" fill="#f0a060"/>
    <ellipse cx="508" cy="292" rx="4.0" ry="13" fill="#e8a045" transform="rotate(25, 458, 292)"/>
    <ellipse cx="514" cy="312" rx="11" ry="4.5" fill="#f0a060"/>
    <ellipse cx="494" cy="325" rx="4.0" ry="12" fill="#e8a045" transform="rotate(-8, 444, 325)"/>
    <ellipse cx="515" cy="340" rx="11" ry="4.5" fill="#f0a060"/>
  </g>
  <g filter="url(#blurMid)" opacity="0.18">
    <ellipse cx="483" cy="185" rx="18" ry="7" fill="#f0a060"/>
    <ellipse cx="501" cy="260" rx="20" ry="7" fill="#e8a045"/>
    <ellipse cx="482" cy="315" rx="18" ry="7" fill="#f0a060"/>
  </g>

  <!-- 増加するエネルギー・時間圧縮ラベル -->
  <text x="630" y="375" text-anchor="middle" font-size="9" fill="#e8a045" font-style="italic">increasing energy density</text>
  <text x="630" y="388" text-anchor="middle" font-size="9" fill="#e8a045" font-style="italic">loss of temporal definability</text>

  <!-- 右→中央への収束矢印 -->
  <path d="M745,240 Q600,240 470,280" stroke="#e8a045" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)" opacity="0.85"/>
  <path d="M745,200 Q600,200 470,240" stroke="#e8a045" stroke-width="1.8" fill="none" marker-end="url(#arrowOrange)" opacity="0.55" stroke-dasharray="5,3"/>

  <!-- ========== 中央下：キーメッセージ ========== -->
  <text x="450" y="516" text-anchor="middle" font-size="13" fill="#ccc" font-weight="bold" font-style="italic">Different trajectories, same boundary.</text>

  <!-- ========== 図注 ========== -->
  <text x="450" y="548" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Two distinct routes of physical convergence approach the same differential horizon.</text>
  <text x="450" y="563" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Spatial convergence proceeds through scale reduction and increasing fluctuation.</text>
  <text x="450" y="578" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Temporal convergence proceeds through increasing velocity and the collapse of temporal duration.</text>
  <text x="450" y="593" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Though their trajectories differ, both terminate in divergence as boundary contact.</text>

</svg>
