  <text x="238" y="115" text-anchor="middle" font-size="9" fill="#9b4fd4" font-style="italic">Transition Band</text>
  <text x="238" y="428" text-anchor="middle" font-size="9" fill="#9b4fd4">breakdown of</text>
  <text x="238" y="441" text-anchor="middle" font-size="9" fill="#9b4fd4">texture</text>

  <!-- first emergence of difference（地平線右直後） -->
  <text x="268" y="148" text-anchor="start" font-size="8.5" fill="#c084fc" opacity="0.85" font-style="italic">first emergence</text>
  <text x="268" y="159" text-anchor="start" font-size="8.5" fill="#c084fc" opacity="0.85" font-style="italic">of difference</text>

