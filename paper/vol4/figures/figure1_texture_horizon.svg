  <text x="612" y="292" text-anchor="middle" font-size="12" fill="#4ecb71" font-weight="bold">renormalization</text>
  <text x="612" y="308" text-anchor="middle" font-size="11" fill="#3aab5a">coarse-graining　／　compression</text>

  <!-- 上層：マクロ -->
  <rect x="335" y="62" width="550" height="145" fill="url(#macroGrad)" rx="2"/>
  <g stroke="#4ecb71" stroke-width="1.8" fill="none" opacity="0.75">
