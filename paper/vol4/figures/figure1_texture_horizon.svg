<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Georgia, serif">

  <rect width="900" height="620" fill="#0d0d0d"/>

  <defs>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="30%" stop-color="#3d1a5e"/>
      <stop offset="60%" stop-color="#7b2fa0"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="microGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="renormGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="macroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <filter id="blur1" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="blur2" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="blur3" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7.0"/>
    </filter>
  </defs>

  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-size="15" fill="#ddd" font-weight="bold">Texture Formation Across the Differential Horizon</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#888" font-style="italic">テクスチャ生成と差の地平線</text>

  <!-- 左領域：未生成 -->
