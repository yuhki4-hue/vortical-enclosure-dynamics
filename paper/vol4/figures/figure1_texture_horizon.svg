    <path d="M340,133 Q355,146 375,128 Q395,113 410,126 Q445,138 480,126 Q515,114 550,126 Q585,138 620,126 Q655,114 690,126 Q725,138 760,126 Q795,114 830,126 Q860,118 880,124"/>
    <path d="M340,150 Q355,162 375,145 Q395,131 410,144 Q445,156 480,144 Q515,132 550,144 Q585,156 620,144 Q655,132 690,144 Q725,156 760,144 Q795,132 830,144 Q860,136 880,142"/>
