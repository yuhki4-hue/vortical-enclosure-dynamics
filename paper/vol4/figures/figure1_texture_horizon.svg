  <!-- マクロラベル（2行） -->
  <text x="612" y="192" text-anchor="middle" font-size="12" fill="#a8e6cf" font-weight="bold">texture</text>
  <text x="612" y="207" text-anchor="middle" font-size="11" fill="#7dcfb0">symmetry　／　conserved quantities</text>

  <!-- 発散矢印（2本） -->
  <!-- micro層 → 地平線 -->
  <path d="M440,412 Q375,408 270,402" stroke="#ff6b6b" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)" opacity="0.9"/>
  <!-- renorm層 → 地平線（点線） -->
  <path d="M410,268 Q352,264 270,282" stroke="#ff6b6b" stroke-width="1.8" fill="none" marker-end="url(#arrowRed)" opacity="0.65" stroke-dasharray="5,3"/>
  <text x="308" y="435" text-anchor="middle" font-size="12" fill="#ff6b6b" font-weight="bold">divergence</text>

  <!-- 縦軸 -->
  <text x="18" y="140" text-anchor="middle" font-size="11" fill="#a8e6cf" transform="rotate(-90, 18, 140)">macro</text>
  <text x="18" y="278" text-anchor="middle" font-size="11" fill="#4ecb71" transform="rotate(-90, 18, 278)">renorm.</text>
  <text x="18" y="408" text-anchor="middle" font-size="11" fill="#6ab0f5" transform="rotate(-90, 18, 408)">micro</text>
  <line x1="28" y1="62" x2="28" y2="462" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="28" y1="212" x2="60" y2="212" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="28" y1="342" x2="60" y2="342" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- 横軸ラベル -->
  <text x="110" y="488" text-anchor="middle" font-size="11" fill="#555">Un-generated Domain</text>
  <text x="238" y="488" text-anchor="middle" font-size="10" fill="#9b4fd4">Differential Horizon</text>
  <text x="612" y="488" text-anchor="middle" font-size="11" fill="#4ecb71">Generated / Textured Domain</text>
  <line x1="30" y1="492" x2="885" y2="492" stroke="#444" stroke-width="1.5"/>
  <polygon points="885,489 880,492 885,495" fill="#444"/>

  <!-- キー対応関係 -->
  <rect x="270" y="318" width="215" height="36" fill="#0d0d0d" rx="4" opacity="0.88" stroke="#333" stroke-width="1"/>
  <text x="378" y="332" text-anchor="middle" font-size="9" fill="#777" font-style="italic">divergence = boundary contact</text>
  <text x="378" y="347" text-anchor="middle" font-size="9" fill="#777" font-style="italic">renormalization = texture extraction</text>

  <!-- キャプション -->
  <text x="450" y="556" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Across the differential horizon, un-generated indeterminacy does not appear directly as physical structure.</text>
  <text x="450" y="571" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">What becomes physically accessible is only the compressed texture extracted through renormalization.</text>
  <text x="450" y="586" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Divergence marks the breakdown of this texture near boundary contact,</text>
  <text x="450" y="601" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">while symmetry and conserved quantities emerge as stable macro-textures of integrated relations.</text>

</svg>
