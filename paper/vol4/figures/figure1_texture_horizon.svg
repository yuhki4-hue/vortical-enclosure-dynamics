  <text x="110" y="440" text-anchor="middle" font-size="11" fill="#444">差なし</text>
  <text x="110" y="455" text-anchor="middle" font-size="11" fill="#444">テクスチャなし</text>
  <text x="110" y="470" text-anchor="middle" font-size="11" fill="#444">記述不能</text>

  <!-- 地平線帯 -->
  <path d="M215,62 Q225,120 220,180 Q218,240 223,300 Q222,360 215,420 Q210,445 220,462 L255,462 Q262,445 258,420 Q255,360 260,300 Q263,240 258,180 Q255,120 260,62 Z"
